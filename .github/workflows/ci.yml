name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (CPU torch)
        run: |
          uv venv .venv
          . .venv/bin/activate
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt
      - name: Run test suite
        run: . .venv/bin/activate && python run_tests.py
